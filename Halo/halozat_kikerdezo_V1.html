<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hálózat alapjai – Záróvizsga kikérdező</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --correct-bg: rgba(16,185,129,0.12);
    --wrong-bg: rgba(239,68,68,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  /* Header */
  header {
    text-align: center;
    padding: 60px 20px 40px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .subtitle {
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
    align-items: center;
  }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border: 1px solid;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }
  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent); color: var(--bg); }
  .btn-secondary {
    border-color: var(--border);
    color: var(--muted);
  }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }
  .btn-danger {
    border-color: var(--danger);
    color: var(--danger);
  }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* Progress */
  .progress-bar {
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    margin-bottom: 32px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.4s ease;
    border-radius: 4px;
  }
  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0.5;
  }
  .question-card.answered-correct { border-color: var(--success); }
  .question-card.answered-correct::before { background: var(--success); opacity: 1; }
  .question-card.answered-wrong { border-color: var(--danger); }
  .question-card.answered-wrong::before { background: var(--danger); opacity: 1; }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #f1f5f9;
  }
  .q-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--warning);
    margin-bottom: 16px;
    opacity: 0.8;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface2);
    user-select: none;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(0,212,255,0.05);
  }
  .option.selected {
    border-color: var(--accent2);
    background: rgba(124,58,237,0.1);
  }
  .option.correct {
    border-color: var(--success);
    background: var(--correct-bg);
  }
  .option.wrong {
    border-color: var(--danger);
    background: var(--wrong-bg);
  }
  .option.missed {
    border-color: var(--success);
    background: var(--correct-bg);
    opacity: 0.7;
  }
  .option.disabled { cursor: default; }
  .opt-marker {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-weight: 700;
    transition: all 0.15s;
  }
  .option.selected .opt-marker { border-color: var(--accent2); background: var(--accent2); }
  .option.correct .opt-marker { border-color: var(--success); background: var(--success); color: #fff; }
  .option.wrong .opt-marker { border-color: var(--danger); background: var(--danger); color: #fff; }
  .option.missed .opt-marker { border-color: var(--success); background: transparent; }

  /* Checkbox style for multi */
  .multi-marker {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
  }
  .option.selected .multi-marker { border-color: var(--accent2); background: var(--accent2); }
  .option.correct .multi-marker { border-color: var(--success); background: var(--success); color: #fff; }
  .option.wrong .multi-marker { border-color: var(--danger); background: var(--danger); color: #fff; }
  .option.missed .multi-marker { border-color: var(--success); background: transparent; }

  /* Text input */
  .text-input-wrap { margin-top: 8px; }
  .text-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input.correct-input { border-color: var(--success); background: var(--correct-bg); }
  .text-input.wrong-input { border-color: var(--danger); background: var(--wrong-bg); }

  /* Submit button for question */
  .q-submit {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 20px;
    border: 1px solid var(--accent2);
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    color: var(--accent2);
    transition: all 0.2s;
  }
  .q-submit:hover { background: var(--accent2); color: #fff; }

  /* Feedback */
  .feedback {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--correct-bg); color: var(--success); border: 1px solid var(--success); }
  .feedback.fail { background: var(--wrong-bg); color: #fca5a5; border: 1px solid var(--danger); }

  /* Results panel */
  #results {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    margin-top: 40px;
  }
  .score-big {
    font-size: 72px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
  }
  .score-label { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-bottom: 32px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .stat-num { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
  .stat-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; align-items: stretch; }
    .btn { text-align: center; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="badge">BME · Hálózat alapjai és üzemeltetése</div>
    <h1>Záróvizsga Kikérdező</h1>
    <p class="subtitle">147 kérdés · 2024–2025 kisZH + VikWiki</p>
  </header>

  <div class="controls">
    <button class="btn btn-primary" onclick="startQuiz()">▶ Indítás / Keverés</button>
    <button class="btn btn-secondary" onclick="showAll()">Összes megjelenítése</button>
    <button class="btn btn-danger" onclick="resetQuiz()">↺ Újrakezd</button>
    <span id="score-live" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-left:auto;"></span>
  </div>

  <div class="progress-label">
    <span id="prog-text">0 / 0 megválaszolva</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>

  <div id="quiz-container"></div>
  <div id="results">
    <div class="score-big" id="res-pct">—</div>
    <div class="score-label">végeredmény</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" id="res-correct" style="color:var(--success)">0</div><div class="stat-txt">Helyes</div></div>
      <div class="stat-box"><div class="stat-num" id="res-wrong" style="color:var(--danger)">0</div><div class="stat-txt">Hibás</div></div>
      <div class="stat-box"><div class="stat-num" id="res-total" style="color:var(--accent)">0</div><div class="stat-txt">Összesen</div></div>
    </div>
    <button class="btn btn-primary" onclick="resetQuiz()" style="margin-right:10px">↺ Újrakezd</button>
    <button class="btn btn-secondary" onclick="startQuiz()">🔀 Keverés</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// KÉRDÉSBANK
// ─────────────────────────────────────────────
const ALL_QUESTIONS = [
{t:"Tartalmazza-e a 102.166.136.0 hálózat a 102.166.140.237 címet, ha a netmask 255.255.248.0?",type:"truefalse",opts:["Igaz","Hamis"],correct:[0],
 explain:"255.255.248.0 = /21 → 2048 cím. Hálózat: 102.166.136.0 – 102.166.143.255. A 102.166.140.237 beleesik ebbe a tartományba → IGAZ."},
{t:"Mi az utolsó, interfésznek adható cím a 101.99.80.0/21 hálózatban?",type:"single",opts:["101.99.87.254","101.99.80.254","101.99.88.254","101.99.87.255"],correct:[0],
 explain:"/21 → 2048 cím, 101.99.80.0–101.99.87.255. Broadcast: 101.99.87.255, utolsó interfész: 101.99.87.254"},
{t:"Az alábbiakból melyik két switch-típust használják az adatközpontokban futó virtuális gépek összekötésére?",type:"multi",opts:["Top-of-Rack","Központi","Fat-tree","End-of-Road"],correct:[0,1],
 explain:"Adatközpontokban Top-of-Rack és Központi (aggregáló) switcheket használnak."},
{t:"Az alábbiakból melyik réteg PDU-inak megjelenítésére NEM képes a WireShark?",type:"single",opts:["mindegyikre képes","alkalmazási réteg","szállítási réteg","adatkapcsolati réteg","hálózati réteg"],correct:[0],
 explain:"A Wireshark MINDEGYIK réteg (alkalmazási, szállítási, hálózati, adatkapcsolati) PDU-it meg tudja jeleníteni – egyedül a fizikai réteg nyers bitjeit nem, de az nem szerepel az opcióknál. Tehát a helyes válasz: mindegyikre képes (a felsorolt rétegek közül)."},
{t:"Az alábbiakból melyik állítás igaz a szállítási réteg protokolljaira?",type:"single",opts:["Alapértelmezetten megbízható szolgáltatást biztosít.","A hosztok közti kommunikációért felel.","A hoszton képződő összes alkalmazási rétegbeli üzeneteket egyetlen szegmensbe gyűjtve adja tovább a hálózati rétegnek.","A processzek közti kommunikációt valósítja meg."],correct:[3],
 explain:"A szállítási réteg processzek közti (end-to-end) kommunikációt valósít meg, nem hosztok közöttit."},
{t:"Mit tárol a DNS egy TLD szervere?",type:"single",opts:["Egy top level domain (pl. egy ország) hiteles (autoritatív) szervereinek címeit.","Az összes más domainhez tartozó TLD szerver címét.","Egy top level domain (pl. egy ország) összes hosztnevét."],correct:[0],
 explain:"A TLD szerver az adott domain autoritatív szervereit ismeri, nem a hosztneveket közvetlenül."},
{t:"Mi igaz az optikai kábelekre?",type:"single",opts:["Az elektromágneses interferencia csökkentésére célszerű külön árnyékolni őket.","A WAN és MAN hálózatokban elsősorban használt kábelek.","A rézalapú technológiákhoz képest kisebb távolságok áthidalására alkalmasak.","A rézalapú technológiákhoz képest kisebb sávszélesség elérésére alkalmasak."],correct:[1],
 explain:"Az optikai kábelek WAN és MAN hálózatokban elsősorban használtak – nagyobb távolság, nagyobb sávszélesség, nem érzékenyek az EMI-re."},
{t:"Mi igaz az UDP-re?",type:"multi",opts:["Nincs kezdeti késleltetés.","Multimédiafolyamok szállítására jól alkalmazható.","Nincs benne kézfogási (handshake) mechanizmus.","Nem tartalmaz hibaellenőrzést."],correct:[0,1,2],
 explain:"UDP: nincs handshake → nincs kezdeti késleltetés, jó multimédiához, nincs kézfogás. DE van checksum (hibaellenőrzés van, bár opcionális)."},
{t:"Milyen előnyei vannak a hálózati rétegek kialakításának? TCP/IP modellre gondoljunk!",type:"multi",opts:["Elkülöníthető funkciókra bontható az összetett működés.","Így nincs szükség protokollra a kommunikációhoz.","Nem kell minden funkciót egyetlen protokollban leírni.","Több szinten is megvalósíthatjuk ugyanazt a funkciót.","Könnyebb a protokollok fejlesztése."],correct:[0,2,4],
 explain:"Rétegzés előnyei: funkcióelkülönítés, nem kell minden egy protokollban, könnyebb fejlesztés."},
{t:"A levélküldés mely szakaszain alkalmazható az SMTP?",type:"multi",opts:["Egyik levelezőszervertől a másik levelezőszerver felé.","A levelezőkliens-programtól a levelezőszerver felé.","A levelezőszervertől a levelezőkliens-program felé."],correct:[0,1],
 explain:"SMTP: kliens→szerver és szerver→szerver. A letöltéshez POP3/IMAP kell."},
{t:"Mi köze a fog computingnak az IoT elterjedéséhez?",type:"single",opts:["Az IoT teszi lehetővé a fog computingot.","Semmi.","A megnövekedett számításigény miatt bizonyos számításokat helyben célszerű elvégezni.","Az IoT eszközök nagy száma miatt a fog computing helyett a cloud computingot célszerű alkalmazni."],correct:[2],
 explain:"IoT → sok eszköz → sok adat → helyi feldolgozás (fog computing) hatékonyabb, mint mindent a cloudba küldeni."},
{t:"Mi igaz a CSMA-CD-re?",type:"multi",opts:["Az ALOHA protokoll ezt a módszert használja.","A Wifi is ezt módszert használja.","Megoldja a rejtett terminál problémát.","A CSMA ütközés érzékeléses kiterjesztése."],correct:[3],
 explain:"CSMA-CD = Carrier Sense Multiple Access with Collision Detection – a CSMA ütközésdetektálással bővített változata. Ethernet használja, nem WiFi."},
{t:"Az alábbiakból melyik a fizikai réteg feladata?",type:"single",opts:["keretezés","hibadetekció","vonali kódolás","torlódáskezelés"],correct:[2],
 explain:"Fizikai réteg: bitátvitel, vonali kódolás, moduláció. Keretezés és hibadetekció az adatkapcsolati réteg feladata."},
{t:"Mi igaz a socketekre?",type:"multi",opts:["Egy hálózati alkalmazás processze ezen keresztül kommunikál a másik oldallal.","A szállítási réteg szolgáltatását veszi igénybe.","Egy hoszton egy socket lehet nyitva."],correct:[0,1],
 explain:"Socket: alkalmazás és szállítási réteg közötti interfész. Egy hoszton több socket is nyitva lehet."},
{t:"Mi okozhatja, ha egy hosztot pingelve nem kapunk választ?",type:"multi",opts:["A hoszt nincs bekapcsolva.","A hoszthoz vezető úton egy router úgy van beállítva, hogy ne válaszoljon a pingre.","A hoszt úgy van beállítva, hogy ne válaszoljon a pingre."],correct:[0,2],
 explain:"Ping nem válaszol: hoszt kikapcsolva VAGY hoszt tűzfal/beállítás blokkolja az ICMP-t. A router beállítása nem okozza, hogy a hoszt ne válaszoljon."},
{t:"Mi igaz az IPv6 protokollra?",type:"multi",opts:["Több globális azonosítót (címet) is rendelhetünk ugyanahhoz az interfészhez.","128 bites címet használ.","Építetten támogatja az átviendő adatok titkosítását.","A link-local címet arra a célra használja, hogy egy hoszt is látsszon az interneten, ha nem adtunk meg neki globális címet."],correct:[0,1],
 explain:"IPv6: 128 bites cím, egy interfészhez több cím rendelhető. A link-local csak lokális kommunikációra való, az interneten nem látszik."},
{t:"Mi igaz az alapértelmezett útra?",type:"multi",opts:["Ha ilyet használunk, nincs szükség címtervezésre.","Egy hálózati topológiában csak egy routeren szabad beállítani.","Akkor is létezik alapértelmezett értéke, ha nem konfigurálunk be.","0 hosszúságú maszkot használunk a megadáskor."],correct:[3],
 explain:"Alapértelmezett út: 0.0.0.0/0, azaz 0 hosszúságú maszk. Több routeren is beállítható, és nem mindig létezik alapból."},
{t:"Az alábbi állítások közül melyik igaz az ARP-re?",type:"single",opts:["Adott logikai címhez tartozó fizikai cím kiderítésére szolgál.","Adott adatkapcsolati rétegbeli címhez tartozó szállási rétegbeli cím kiderítésére szolgál.","Adott logikai címhez tartozó földrajzi cím kiderítésre szolgál.","Adott fizikai címhez tartozó hálózati cím kiderítésre szolgál."],correct:[0],
 explain:"ARP: IP cím → MAC cím (fizikai cím) feloldás."},
{t:"Mit jelent Wifi esetén az infrastruktúra mód?",type:"single",opts:["A végpontok egymással kommunikálva egy üzenetek továbbítására képes infrastruktúrát hoznak létre.","A hálózat a vezetékes hálózatoknál is jellemző switch-router infrastruktúrát alkalmazza.","Az adattovábbítás nagy sebességű MIMO-infrastruktúra segítségével valósul meg.","A végpontok elérési pont (access point) segítségével csatlakoznak a hálózathoz."],correct:[3],
 explain:"Infrastruktúra mód: végpontok AP-n (access point-on) keresztül kommunikálnak – szemben az ad-hoc móddal."},
{t:"Mi igaz a MIB-adatbázisra?",type:"single",opts:["Minden bejegyzést lehet olvasni és írni az SNMP-vel.","Csak gyártófüggetlen (nyílt szabványos) bejegyzéseket tárol.","Adatleíró nyelve az SNMP.","Az elemeit azonosító OID-k az adatbázis faszerkezetét tükrözik."],correct:[3],
 explain:"MIB (Management Information Base): OID-k (Object Identifiers) hierarchikus/faszerkezetű adatbázist alkotnak. Az SNMP a protokoll, nem az adatleíró nyelv (az ASN.1)."},
{t:"Mikor használjuk a longest prefix matching-elvet?",type:"single",opts:["Amikor egy routing-tábla átfedő hálózatokról szóló bejegyzéseket tartalmaz.","Egy datagram célcímének meghatározásakor.","Amikor egy routing tábla különböző hálózati címekhez azonos hosszúságú maszkot tartalmaz.","Statikus routing esetén."],correct:[0],
 explain:"Longest prefix matching: amikor a routing táblában átfedő (overlapping) bejegyzések vannak, a leghosszabb (legspecifikusabb) prefix nyer."},
{t:"Mi igaz a távolságvektor alapú routingra?",type:"multi",opts:["Kiegészítő módszerek (split horizon, poisoned reverse) nélkül a rossz hír nagyon lassan terjed el.","A távoli hálózatokról csak aggregált információt tárolnak a routerek.","Egy link állapotának megváltozásáról közvetlen üzenetet kell küldeni a hálózat összes routerének.","Vektoriális szorzatot képez a kapott vektorokból, és ezzel határozza meg a routing táblába kerülő irányt.","A routerek a szomszédoktól kapott távolságvektorokat használják fel egy hálózati prefix távolságának számításához."],correct:[0,1,4],
 explain:"Távolságvektor: szomszédoktól kapott vektorok alapján számít, aggregált info, lassú konvergencia (count-to-infinity). Link-state az, ahol mindenkinek küld."},
{t:"Milyen mezői vannak az UDP szegmens fejlécének?",type:"multi",opts:["forrás IP cím","forrás port","sorszám","szegmens hossz"],correct:[1,3],
 explain:"UDP fejléc: forrás port, cél port, hossz, checksum. IP cím a hálózati rétegben van, sorszám TCP-ben van."},
{t:"Mit jelent az osztályalapú címzés?",type:"single",opts:["Olyan IPv6 megoldást, ahol a hálózati forgalom továbbítási prioritását a célcím határozza meg.","Olyan IPv4 címzést, ahol a hálózati címeket osztályokba soroljuk aszerint, hogy milyen maszkot használnak.","Olyan IPv4 címzést, ahol a címeket osztályokba soroljuk, és azonos hálózati maszkot használunk minden azonos osztályú hálózatban.","Az Interneten használt címeket IPv4 vagy IPv6 osztályba soroljuk."],correct:[2],
 explain:"Osztályalapú (classful) IPv4 címzés: A/B/C/D/E osztályok, fix maszkokkal (pl. A osztály: /8)."},
{t:"Az alábbiakból melyik három állítás igaz az IoT-re?",type:"multi",opts:["Nincsenek kidolgozott protokollok az elemek közti kommunikációhoz.","Minden hálózati rétegben azonos támogatást igényel.","Jelentős biztonsági kihívást jelent az eszközök nagy száma és egyszerűsége miatt.","Alacsony energiafogyasztást igénylő technológiák is szükségesek hozzá.","Sok esetben mobilitást igényel."],correct:[2,3,4],
 explain:"IoT: biztonsági kihívás, alacsony energiaigény szükséges, mobilitás. Vannak protokollok (MQTT stb.), és különböző rétegekben eltérő igények vannak."},
{t:"Mit jelent a sávon kívüli (out-of-band) vezérlés?",type:"single",opts:["Egyetlen csatornán kommunikálnak a résztvevők, és ez sávon kívül van.","A használható frekvenciasávon kívül is lehetséges a kommunikáció.","Nincs vezérlés, mert nem tudunk kapcsolatot létesíteni a sávban.","A vezérlőinformációk és az adatok külön csatornán mennek."],correct:[3],
 explain:"Out-of-band: adat és vezérlés külön csatornán utazik (pl. FTP: 21-es port vezérlés, 20-as port adat)."},
{t:"Mi igaz a HTTP-sütikre?",type:"multi",opts:["A süti értékét a szerver a HTTP-válaszüzenet fejlécében küldi át.","Csak a kliensoldalon kell eltárolni a hozzájuk kapcsolódó információt.","Egy HTTP-kérésben mindig az összes sütit el kell küldeni.","Állapotkezelésre használjuk őket."],correct:[0,3],
 explain:"HTTP süti: Set-Cookie fejlécben küldi a szerver, állapotkezelésre szolgál. Szerver oldalon is lehet info, nem csak kliensen."},
{t:"Az alábbiakból melyik hármat tekinthetjük a hálózati funkciók virtualizálásából eredő előnynek?",type:"multi",opts:["Gyorsabb az adattovábbítás, mint a hagyományos funkciót ellátó eszközöknél.","Olcsó hardveren is megvalósíthatók.","Új hálózati szolgáltatások bevezetésére rugalmasabb megoldást adnak.","A virtualizált funkciók szükség esetén hatékonyan mozgathatók.","Egy végpont-végpont forgalomnak mindig elég egyetlen funkcionális pontot érinteni."],correct:[1,2,3],
 explain:"NFV előnyök: olcsó hardware, rugalmasság, funkciók mozgathatósága. Nem feltétlenül gyorsabb, és nem elég egy pont."},
{t:"Mi igaz a TCP slow start (lassú indulás) mechanizmusára?",type:"multi",opts:["Az AIMD (additive increase, multiplicative decrease) alapelv alapján működik.","A kapcsolat elején 1 MSS méretű torlódási ablakkal indul.","Minden nem duplikált nyugta érkezésekor növeli a torlódási ablakot.","A torlódási ablakot minden RTT idő alatt nagyjából ugyanakkora egységgel növeli."],correct:[1,2],
 explain:"Slow start: 1 MSS-ről indul, minden ACK-ra duplázódik (exponenciális). Az AIMD a congestion avoidance fázis."},
{t:"Tartalmazza-e a 117.85.62.0 hálózat a 117.85.62.254 címet, ha a netmask 255.255.254.0?",type:"truefalse",opts:["Igaz","Hamis"],correct:[0],
 explain:"117.85.62.0/23 → 117.85.62.0–117.85.63.255. A 117.85.62.254 beleesik → Igaz."},
{t:"Tartalmazza-e a 87.120.246.48 hálózat a 87.120.246.250 címet, ha a netmask 255.255.255.240?",type:"truefalse",opts:["Igaz","Hamis"],correct:[1],
 explain:"255.255.255.240 = /28, 16 cím. 87.120.246.48–87.120.246.63. A 87.120.246.250 nem esik bele → Hamis."},
{t:"Mi az első, interfésznek adható cím a 101.96.0.0 hálózatban, ha a netmask 255.240.0.0?",type:"single",opts:["101.96.0.0","101.96.0.1","101.96.1.1","101.96.1.0"],correct:[1],
 explain:"Hálózati cím: 101.96.0.0, első hoszt: 101.96.0.1"},
{t:"Hogyan nevezzük az objektumot, melyen keresztül egy hálózati alkalmazás egy processze átadja üzeneteit a szállítási rétegnek?",type:"single",opts:["datagram","socket","token","CTS"],correct:[1],
 explain:"Socket: az alkalmazási és szállítási réteg közötti interfész."},
{t:"Melyik területen NEM alkalmazhatóak IoT-eszközök?",type:"single",opts:["közösségi közlekedés","ipar","gyakorlatilag mindenhol alkalmazhatóak","mezőgazdaság"],correct:[2],
 explain:"Az IoT gyakorlatilag mindenhol alkalmazható – nincs olyan terület ahol NEM lehetne."},
{t:"Egy üres MAC cím táblával rendelkező switch egyik portján keretet kap, mely nem neki szól. Mit tesz?",type:"single",opts:["Kiküldi minden aktív portján.","Kiküldi minden másik aktív portján.","Eldobja a keretet.","ARP-üzenetet küld minden másik portján kideríteni a fizikai címet."],correct:[1],
 explain:"Ismeretlen cél-MAC esetén a switch flooding-ot végez: kiküldi minden portján (a beérkező kivételével)."},
{t:"Mi igaz a BGP-re?",type:"multi",opts:["Az Internet de facto IGP-szabványa.","TCP alapú üzenetváltást használ.","Az ország aktuális világpolitikai helyzetétől függnek a beállításai.","Prefixeket és attribútumaikat hirdeti az autonóm rendszerek (AS-ek) között.","Két változata, az eBGP és az iBGP nem kompatibilisek."],correct:[1,3],
 explain:"BGP: TCP-t használ (179-es port), AS-ek közötti (EGP), prefixeket és attribútumaikat hirdeti. EGP, nem IGP."},
{t:"Mi igaz a TCP kapcsolatkezelésére?",type:"multi",opts:["A szerver első üzenete egy ACK típusú üzenet.","A kapcsolatot a kliens kezdeményezi.","A kapcsolat felépítése négylépéses kézfogás segítségével történik.","A kliens első üzenete egy SYN típusú üzenet."],correct:[1,3],
 explain:"TCP háromfázisú kézfogás: kliens SYN → szerver SYN-ACK → kliens ACK. A kliens kezdi, első üzenet SYN."},
{t:"Az alábbiakból melyik igaz az UDP-alapú socketekre?",type:"multi",opts:["Datagramok átvitelére szolgál.","A kliens socket portszáma az adott alkalmazásnak megfelelő 'jól ismert' portszám.","Azonos alkalmazást használó különböző kliensek datagramjai ugyanahhoz a szerver sockethez érkeznek be.","A szerver minden klienshez új kapcsolat socketet hoz létre."],correct:[0,2],
 explain:"UDP socket: datagramok, kapcsolatmentes, minden kliens ugyanahhoz a szerversockethez küld. Nincs külön kapcsolat-socket kliensenként."},
{t:"Mit definiálnak a protokollok?",type:"multi",opts:["Az üzenetek formátumát","Az üzenetváltás használt sorrendjét","Az üzenetben szereplő felhasználói adatok pontos értékét","Egy üzenet érkezése által kiváltott reakciót","A kommunikáció résztvevőinek adatait"],correct:[0,1,3],
 explain:"Protokoll: formátum (szintaxis), üzenetváltás sorrendje (szemantika), és akciók (reakciók). Felhasználói adatok értékét nem definiálja."},
{t:"Tartalmazza-e a 103.102.138.8/29 hálózat a 103.102.138.119 címet?",type:"truefalse",opts:["Igaz","Hamis"],correct:[1],
 explain:"/29 = 8 cím. 103.102.138.8–103.102.138.15. A .119 nem esik bele → Hamis."},
{t:"Mit jelent a TCP protokollnál a SACK használata?",type:"single",opts:["A küldő összefogja a szegmenseket nagyobb egységekbe (SACK – zsák).","A vevő információt küld arról is, hogy melyik bájtok nem érkeztek meg (selective ACK).","Csak egy nyugtát küldünk a teljes adatfolyamra (single ACK)."],correct:[1],
 explain:"SACK (Selective ACK): a vevő jelzi, mely bájtok érkeztek meg és melyek nem – hatékonyabb újraküldés."},
{t:"Mi a hibakeresés és javítás tipikus menete?",type:"single",opts:["Megfigyelés, elemzés, lehetséges okok tesztelése, megoldás, javítás, ellenőrzés.","Hiba elkerülése, hibakorrekció a hálózat több pontján.","Megfigyelés, ellenőrzés, megoldás kiválasztása, javítás végrehajtása.","Megfigyelés, javítási megoldások kipróbálása, ellenőrzés."],correct:[0],
 explain:"Tipikus hibakeresési folyamat: megfigyelés → elemzés → okok tesztelése → megoldás → javítás → ellenőrzés."},
{t:"Az alábbiakból melyik két állítás igaz a leaf-spine topológiára?",type:"multi",opts:["Egyetlen központi elemhez csillagszerűen kapcsolt levél switch-ek alkotják a topológiát.","Nagy hátránya, hogy bekötött szerverek közti átlagos logikai távolság elég nagy.","Kevesebb hierarchiaszintet tartalmaz, mint egy általános célú hálózat.","Napjaink adatközpontjaiban nagyon elterjedt.","Az Internet topológiája."],correct:[3,2],
 explain:"Leaf-spine: adatközpontban elterjedt, kevesebb hierarchiaszint (2 szint), kis és egyenletes latencia."},
{t:"Mi igaz a frekvenciaosztásos multiplexelésre?",type:"single",opts:["Csak vezeték nélküli kapcsolatoknál alkalmazható.","Ezzel osztják szét az időszeleteket.","Az erőforrást a frekvenciatartományban osztja fel az egyes kapcsolatok között.","Hatékony forráskihasználás nem egyenletes forgalom esetén is."],correct:[2],
 explain:"FDM: frekvenciasávokat oszt szét a kapcsolatok között. Egyenletes forgalomnál hatékony, nem egyenletesnél kevésbé."},
{t:"Az adott rétegmodellben hol szerepel az alkalmazási réteg?",type:"single",opts:["A TCP/IP-modellben közvetlenül a szállítási réteg felett.","Az ISO/OSI referenciamodellben közvetlenül a szállítási réteg felett.","A TCP/IP-modellben közvetlenül a hálózati réteg felett.","Csak a TCP/IP-modellben szerepel."],correct:[0],
 explain:"TCP/IP-ben: hálózati hozzáférés → internet → szállítási → alkalmazási. Az alkalmazási közvetlenül a szállítási felett van. OSI-ban a szállítási felett munkamenet, megjelenítési, alkalmazási van."},
{t:"Melyik NEM HTTP-válaszüzenettípus?",type:"multi",opts:["Message Lost","Forbidden","OK","Acknowledged","Broken"],correct:[0,3,4],
 explain:"HTTP válaszok: 200 OK, 403 Forbidden, stb. Message Lost, Acknowledged, Broken nem HTTP státuszkódok."},
{t:"Miért sávon kívüli (out-of-band) vezérlésű az FTP?",type:"single",opts:["Az FTP nem sávon kívüli vezérlésű.","Az adatok és a vezérlőinformációk külön csatornán mennek.","Nincs vezérlés, mert nem tudunk kapcsolatot létesíteni.","Három csatornán kommunikálnak a résztvevők."],correct:[1],
 explain:"FTP: 21-es port = vezérlés, 20-as port = adatátvitel → külön csatorna → out-of-band."},
{t:"Mi a szerepe lokális (default) DNS-szervernek?",type:"multi",opts:["Csak lokális címeket tud feloldani.","TLD-szerverekkel kommunikál.","A hosztok felé továbbítja a kért névfeloldási bejegyzéseket."],correct:[1,2],
 explain:"Lokális DNS: rekurzív lekérdezést végez (TLD szerverekkel is kommunikál), és visszaadja az eredményt a hosztnak."},
{t:"Egy sikeres ping segítségével meg tudjuk állapítani, hogy...",type:"multi",opts:["...sikeresen kapcsolódott-e a processzünk a szerverhez.","...mekkora az aktuális RTT a távoli hoszttal való kommunikációban.","...milyen porton kommunikálunk.","...be van-e kapcsolva a távoli hoszt."],correct:[1,3],
 explain:"Ping: ICMP echo → megtudjuk az RTT-t és hogy a hoszt be van kapcsolva (és elérhető). Portot, processzkapcsolatot nem mutat."},
{t:"Mit jelent a 403-as állapotkód HTTP-ben?",type:"single",opts:["Forbidden","Bad Request","OK","Not Found"],correct:[0],
 explain:"403 = Forbidden (tiltott hozzáférés). 400=Bad Request, 200=OK, 404=Not Found."},
{t:"Mi igaz TCP üzenetek demultiplexálására?",type:"single",opts:["Megkülönböztetés forrás IP - cél IP pár alapján.","Megkülönböztetés forrás IP & port - cél IP & port négyes alapján.","Megkülönböztetés forrás IP & port pár alapján.","Megkülönböztetés forrás port - cél port pár alapján.","Megkülönböztetés cél IP & port pár alapján."],correct:[1],
 explain:"TCP demux: 4-es (4-tuple): forrás IP, forrás port, cél IP, cél port – minden kombináció egyedi kapcsolatot azonosít."},
{t:"Mi igaz a TCP kapcsolatkezelésére?",type:"multi",opts:["A kapcsolat lebontása egy FIN típusú üzenettel végződik.","A kapcsolat felépítésének utolsó lépésében a kliens olyan ACK szegmenst küld, mely már adatot is tartalmaz.","A kapcsolat lebontása háromutas kézfogással történik.","A kapcsolat felépítése magában foglalja a sorszám és a forgalomszabályozás inicializálását."],correct:[1,3],
 explain:"TCP felépítés: sorszámok és ablak méret inicializálódik. Utolsó ACK tartalmazhat már adatot. Lebontás 4 üzenettel (FIN+ACK, FIN+ACK)."},
{t:"Mi igaz a TCP torlódáskezelésére?",type:"multi",opts:["A TCP megbízható szállítására kidolgozott mechanizmusok segítségével működik.","Csomagvesztési információk alapján történik.","Szabályozás köztes hálózati eszközök üzenetei alapján.","A hálózat átbocsátóképességéhez illeszkedik."],correct:[1,3],
 explain:"Az egyetlen HAMIS állítás az első: 'A TCP megbízható szállítására kidolgozott mechanizmusok segítségével működik' – a torlódáskezelés KÜLÖN mechanizmus, nem a megbízható szállítás (pl. sorrend, újraküldés) eszközeire épül. A három igaz: csomagvesztés jelzi a torlódást; ECN révén köztes eszközök is küldhetnek jelzést; és a küldési ablak igazodik a hálózat kapacitásához."},
{t:"Melyik protokollt használhatjuk titkosításhoz?",type:"multi",opts:["QUIC","HTTP","DNS","telnet","SSH"],correct:[0,4],
 explain:"Titkosítást biztosít: SSH (Secure Shell) és QUIC (beépített TLS 1.3). HTTP, DNS, telnet önmagukban nem titkosítanak."},
{t:"Hogyan nevezzük a hálózati réteg PDU-ját?",type:"single",opts:["Window","Frame","Datagram","útvonal"],correct:[2],
 explain:"Hálózati réteg PDU = datagram (csomag). Frame = adatkapcsolati, Segment = szállítási."},
{t:"Melyik állítás igaz az interneten használt címzésre?",type:"multi",opts:["Hierarchiamentesen szervezett.","Lehetővé teszi, hogy az irányítási táblákban összevonhassunk egy irányba eső hálózatokat.","Az IPv5 szabványt használja.","Az alapkoncepció szerint globálisan egyedi címeket rendel az egyes hosztokhoz."],correct:[1,3],
 explain:"Internet címzés: globálisan egyedi (elvileg), hierarchikus (prefix aggregáció lehetséges). IPv5 nem létező szabvány."},
{t:"Mi igaz az automatikus címkonfigurálásra?",type:"multi",opts:["A kapott cím adott ideig használható.","IPv6-nál nincs rá szükség.","IPv4-ben az ICMP-t kell használni hozzá.","Nem kapunk címet, ha a tartomány túl kicsi."],correct:[0,3],
 explain:"DHCP: a kiosztott cím bérlet (lease) időhöz kötött. Ha elfogytak a szabad címek, nem kapunk újat."},
{t:"Mi történik egy routernél, ha nincs illeszkedő bejegyzés a táblában?",type:"single",opts:["Mindig van alapértelmezett út.","Továbbítás forráscím alapján.","A datagramot eldobjuk.","ICMP-üzenetben értesítjük a küldőt és visszaküldjük.","Legkisebb számú interface-en továbbítjuk."],correct:[2],
 explain:"Ha nincs illeszkedő bejegyzés és nincs alapértelmezett út sem, a datagram eldobásra kerül (és ICMP Destination Unreachable küldődhet)."},
{t:"Mit kell figyelembe venni statikus út megadásánál?",type:"single",opts:["A statikus szabály felülbírálhatja a dinamikusan tanult szabályt, ha azonos értelmű","Egy kimeneti portra csak egy statikus út vonatkozhat.","Csak osztályalapú címzésnek megfelelő maszk.","Nem használhatunk 0 hosszú maszkot."],correct:[0],
 explain:"Statikus út magasabb admin távolsággal bír, de konfiguráció függvényében felülbírálhat dinamikus útvoanalat."},
{t:"Mi igaz a dinamikus routinggal kapcsolatban?",type:"multi",opts:["A datagramok útvonala dinamikusan változik, vagyis a router nem a routing-táblákat veszi figyelembe a továbbításkor.","A hálózat változása esetén az irányítási táblák automatikusan (kézi beavatkozás nélkül) frissülnek.","Minden dinamikus megoldásnak az az alapja, hogy az összes router megismeri a teljes hálózati topológiát.","Nagyobb hálózatok esetén konfigurációs szempontból hatékonyabb ezek használata."],correct:[1,3],
 explain:"Dinamikus routing: automatikus frissítés, nagyobb hálózatoknál hatékonyabb. Nem minden protokoll ismeri a teljes topológiát (pl. távolságvektor nem)."},
{t:"Az alábbiakból melyik állítás igaz a MAC-címekre?",type:"single",opts:["Hosszuk 32 bit.","A hálózati rétegben használjuk őket.","Nem hierarchikusak.","A logikai címek csoportjába tartoznak."],correct:[2],
 explain:"MAC cím: 48 bit, adatkapcsolati réteg, fizikai/hardver cím, NEM hierarchikus (ellentétben az IP-vel)."},
{t:"Mely állítások igazak az üzenetszórásos közeghozzáférési típusra?",type:"multi",opts:["A kábelmodemes hozzáférés feltöltési (upstream) iránya.","Két router közötti összeköttetésre használható.","A kábelmodemes hozzáférés letöltési (downstream) iránya.","Az Ethernet ezt használja."],correct:[0,3],
 explain:"Broadcast közeghozzáférés: egy adó jele mindenki hallja. Ethernet → broadcast médium (egy szegmensen mindenki hall mindenkit). Kábelmodem downstream → a szolgáltató egyetlen csatornán sugároz minden előfizetőnek egyszerre (broadcast). Az upstream viszont pont-pont jellegű (mindenki külön időben küld a fejállomásnak)."},
{t:"Melyik állítás igaz az adatkapcsolati rétegre?",type:"single",opts:["Csak vezetékes kapcsolat esetén létezik.","Egyik feladata a titkosítás.","Fizikai címeket használ.","Fizikai megvalósítástól független protokollt használ."],correct:[2],
 explain:"Adatkapcsolati réteg: MAC (fizikai) címeket használ, keretezés, hibadetekció. Wireless-ben is létezik."},
{t:"Az alábbiakból melyik két állítás igaz a VLAN-okra?",type:"multi",opts:["Kétféle típus: privát és publikus.","Segítségükkel csökkenthető az üzenetszórásból adódó forgalom.","A hurokmentes topológia biztosítására szolgálnak.","Alkalmazásukkal több LAN-ba választhatjuk szét a hosztokat ugyanazokat a kapcsolókat használva.","A VLAN-ok közti kommunikációt a switch-ek továbbító táblájának megfelelő konfigurációja biztosítja."],correct:[1,3],
 explain:"A két igaz állítás: (1) VLAN szétválasztja a broadcast tartományokat → csökkenti az üzenetszórási forgalmat. (2) Ugyanazokat a fizikai switch-eket használva logikailag több külön LAN-ra lehet osztani a hosztokat. — A switch-es VLAN-közi kommunikáció (5. opció) HAMIS: VLAN-ok között kommunikálni csak routeren (L3) keresztül lehet, nem a switch egyszerű továbbító táblájával."},
{t:"A rétegezéskor a beágyazás azt jelenti, hogy...",type:"single",opts:["...a kapott adatról levesszük a felettünk lévő réteg fejlécét.","...a kapott adatot a protokoll saját fejlécinformációkkal látja el.","...a kapott adat elejéhez cím-, végéhez pedig hibajavító információkat illeszt.","...növeljük a megbízhatóságot.","...a csomagokról eltávolítjuk a nem szabályos fejléceket."],correct:[1],
 explain:"Beágyazás (encapsulation): az adatra a saját réteg fejlécét (esetleg farkat) illeszti rá."},
{t:"Melyek a DNS-rendszer jellemzői?",type:"multi",opts:["Hierarchikus szervezésű adatbázist használ.","A szerverekben gyorsítótárat alkalmaznak.","Titkosított bináris vezérlőinformációkat használ.","Levelek törlésére alkalmazható."],correct:[0,1],
 explain:"DNS: hierarchikus elosztott adatbázis, szerverekben cache van (TTL alapú). Nem titkosított alapból, nem email."},
{t:"Melyik állítás igaz a címfordításra (NAT-ra)?",type:"multi",opts:["IPv6 link-local cím fordítása globálisra.","Nem használja a transzport réteg azonosítóit.","A router egy címfordító táblát használ.","Egyik motivációja az IPv4-címek elfogyása."],correct:[2,3],
 explain:"NAT: IPv4-hiány miatt jött létre, a router port+cím táblát vezet. Port számokat IS használ (PAT/NAPT esetén)."},
{t:"Mely állítások igazak a 802.11-ben (WiFi) használt keretekre?",type:"multi",opts:["Tartalmaz ellenőrző összeget.","Teljesen kompatibilis az Ethernet kerettel.","Négy fizikai címet is tartalmazhat.","Nem tartalmaz vezérlési információkat."],correct:[0,2],
 explain:"WiFi keret: tartalmaz FCS (checksum) és akár 4 MAC-cím mezőt (infrastruktúra módban). Nem kompatibilis Ethernet kerettel."},
{t:"Mely síkokat NEM kell megvalósítani egy router esetében?",type:"multi",opts:["útvonali (routing) sík","üzemeltetési (management) sík","osztott (shared) sík","vezérlési (control) sík","adattovábbítási (data) sík"],correct:[1,2],
 explain:"Router kötelező síkok: vezérlési (routing protokollok) és adattovábbítási (forwarding). Management és osztott sík nem kötelező."},
{t:"Mely két állítás igaz a rejtett terminál problémával?",type:"multi",opts:["Kiküszöböléséhez nem szükséges beállítani a csatornafoglaltsági időt, mivel minden terminál véletlenszerűen küldi az adatokat, így nem tud kialakulni ütközés.","Az ALOHA protokoll használatával küszöbölhető ki.","RTS- és CTS-üzenetek használatával küszöbölhető ki ez a probléma.","Azért alakulhat ki ez a probléma, mert a csatornáról nem mindig dönthető el, hogy szabad-e."],correct:[2,3],
 explain:"Rejtett terminál: nem látja a másik adót → csatorna foglaltságát nem érzékeli → RTS/CTS megoldja."},
{t:"A H hosztról indított pingre nincs válasz. Két ok:",type:"multi",opts:["Nem jól állítottuk be a H hoszton a default gateway-t.","A gép nem ugyanabban a LAN-ban van, és nincs bekapcsolva.","Tűzfal szűri ki az ICMP echo request csomagokat.","A gép ugyanabban a LAN-ban van, és nincs bekapcsolva."],correct:[1,3],
 explain:"Ping nem válaszol: (1) más LAN, kikapcsolva → nem érkezik meg, (2) ugyanabban a LAN-ban van, kikapcsolva → ARP sem válaszol. Tűzfal és gateway inkább egyéb hibaokok."},
{t:"Milyen típusú cím a 01-00-05-AA-AA-AA MAC cím?",type:"single",opts:["anycast","broadcast","Ethercast","multicast"],correct:[3],
 explain:"Ha a MAC cím legkisebb helyiértékű bitje (LSB) 1, akkor multicast cím. 01 = 0000 0001 → LSB=1 → multicast."},
{t:"Hogyan szervezik az FTP-ben a vezérlőinformációk és az adatok átvitelét?",type:"single",opts:["Nincs szükség vezérlő információkra, csak az adatok átvitelére.","Sávon-belüli jelzést használnak.","Sávon-kivüli jelzést használnak.","Ugyanaz a TCP kapcsolat viszi mindkét adatot."],correct:[2],
 explain:"FTP out-of-band: 21-es port (vezérlés) és 20-as port (adat) – külön TCP kapcsolatok."},
{t:"Melyek a késleltetés változó komponensei?",type:"multi",opts:["Sorbanállási késleltetés.","Jelterjedési késleltetés.","Feldolgozási késleltetés.","Átviteli késleltetés."],correct:[0,1],
 explain:"Változó késleltetés: sorbanállási (queue-k töltöttségétől függ) és jelterjedési (útvonal változhat). Feldolgozási és átviteli viszonylag állandó."},
{t:"Melyik három állítás igaz a csatornaosztásos protokollokra?",type:"multi",opts:["Egyik esete az FDMA.","Állandó forgalmi terhelés esetén érdemes használni.","Ingadozó forgalom esetén is igen hatékony.","A WDMA nem tartozik közéjük.","Végpontokhoz egy adási egységet rendel."],correct:[0,1,4],
 explain:"Csatornaosztás (TDM/FDM): FDMA az egyik fajtája, állandó forgalomnál hatékony, minden végponthoz fix egység. Ingadozónál nem hatékony."},
{t:"Mi igaz az UDP protokollra?",type:"multi",opts:["Nem tartalmaz semmilyen torlódáskezelést.","Egyszerű, két lépéses kapcsolat felépítést alkalmaz.","Az egymás után küldött szegmenseinek sorrendje összekeveredhet.","Minden szegmens küldése független a többitől."],correct:[0,2,3],
 explain:"UDP: nincs torlódáskezelés, nincs kapcsolat-felépítés (kapcsolatmentes), sorrend felcserélődhet, minden datagram független."},
{t:"Mi igaz a linkállapot alapú routingra?",type:"multi",opts:["A routerek csak a szomszédoktól kapott információkat használhatják fel egy hálózati prefix távolságának számításához.","Egy router minden más routernek elküldi a hozzákapcsolt linkek állapot információit.","Minden router a teljes hálózati kép alapján számítja az útvonalakat.","Az összes router időben szinkronizált számítást végez ugyanazon gráf alapján.","Gyorsabb a konvergencia, mint a távolságvektoros megoldás esetén."],correct:[1,2,4],
 explain:"Link-state: minden router elküldi a link-állapotokat (LSA flood), mindenki teljes képet épít, Dijkstra algoritmust futtat, gyorsabb konvergencia."},
{t:"Az alábbiak közül melyik típusú kábel rézalapú?",type:"multi",opts:["UTP","monomódusú kábel","STP","koaxiális kábel","multimódusú kábel"],correct:[0,2,3],
 explain:"Rézalapú: UTP (csavart érpár, árnyékolatlan), STP (árnyékolt), koaxiális. Optikai: mono- és multimódusú."},
{t:"Az alábbiak közül melyik igaz az UDP-alapú socketekre?",type:"single",opts:["A szerversockethez tipikusan az operációs rendszer rendel portszámot.","A különböző kliensek ugyanazon a szerversocketen keresztül kommunikálnak a szerverrel.","Soha nem használ kapcsolatsocketeket.","Lehetővé teszi adatfolyamok (streamek) átvitelét."],correct:[1],
 explain:"UDP socket: minden kliens ugyanahhoz a szerversockethez küld (nincs külön kapcsolat-socket). Nincs stream, nincs kapcsolat."},
{t:"Mi a szállítási rétegbeli protokollok esetén a demultiplexálás (nyalábbontás)?",type:"single",opts:["A sockettől kapott üzenetek szétdarabolása, hogy beleférjen az MSS-be.","A hálózati rétegtől kapott üzenetek továbbítása a megfelelő socketnek.","Az alkalmazási rétegtől kapott üzenetek továbbítása a megfelelő hoszt felé.","Az alkalmazási rétegtől kapott üzenetek továbbítása a megfelelő hálózati rétegbeli protokoll felé."],correct:[1],
 explain:"Demultiplexálás: a beérkező szegmenseket a megfelelő socket (alkalmazás-folyamat) felé irányítja portszám alapján."},
{t:"Az alábbiak közül melyik TCP flag (jelzőbit)?",type:"multi",opts:["ACK (a nyugtamező érvényes)","FIN (kapcsolat vége)","QoS (minőségi átvitel)","RPT (újraküldött szegmens)"],correct:[0,1],
 explain:"TCP flagek: SYN, ACK, FIN, RST, PSH, URG. QoS és RPT nem TCP flagek."},
{t:"Mi nem igaz az UDP-re?",type:"single",opts:["A fejléce kisebb mint a TCP fejléce.","Nincs benne kézfogási (handshake-) mechanizmus.","Gondoskodik a szegmensek sorrendhelyességéről.","Csak implicit nyugtázást használ."],correct:[2],
 explain:"UDP NEM gondoskodik sorrendhelyességről – ez TCP funkció. Az UDP fejléce valóban kisebb, nincs handshake."},
{t:"Mi NEM igaz a hálózati protokollokra?",type:"multi",opts:["Elegendő ha az egyik kommunikáló fél betartja a protokollt","Csak a gépi kommunikációban alkalmazhatók","PDU-kat juttatnak át a hálózaton","Definiálják egy üzenet fejlécét","A különböző hálózati rétegekben lévő protokollok más-más célt szolgálnak"],correct:[0,1],
 explain:"Protokollokra: mindkét félnek be kell tartania, nem csak gépek között (emberek is betarthatnak protokollt). PDU-kat juttatnak át, fejlécet definiálnak, rétegfüggők."},
{t:"Egy csomagkapcsolt hálózatban a csomag elküldése előtt a forrás mindig meghatározza, hogy a csomagot mely linkek sorozatán keresztül kell továbbítani a nyelőhöz.",type:"truefalse",opts:["Igaz","Hamis"],correct:[1],
 explain:"Hamis! Csomagkapcsolásnál az útvonalat a routerek határozzák meg menet közben, nem a forrás előre. (Az áramkörkapcsolásnál van előre meghatározott útvonal.)"},
{t:"Mi nem igaz a HTTP-re?",type:"multi",opts:["Állapotmentes","Binárisan kódolt fejléceket használ","Megbízható adatátvitelt igényel","Az alkalmazási rétegben működik","A 80-as UDP portot használja"],correct:[1,4],
 explain:"A két NEM IGAZ állítás: (1) 'Binárisan kódolt fejléceket használ' – HTTP/1.x szöveges fejléceket használ (ASCII), nem binárisat. (2) '80-as UDP portot használja' – HTTP a 80-as TCP portot használja, nem UDP-t. Az állapotmentes (igaz), megbízható TCP-t igényel (igaz), alkalmazási réteg (igaz)."},
{t:"Melyek a DNS rendszer jellemzői?",type:"multi",opts:["Titkosított bináris vezérlőinformációkat használ","Hierarchikus szervezésű adatbázist használ","Levelek törlésére alkalmazható","A szerverekben gyorsítótárat alkalmaznak"],correct:[1,3],
 explain:"DNS: hierarchikus elosztott adatbázis, caching. Nem titkosít alapból, nem email protokoll."},
{t:"Sikeres ping eredményeként egy adott hosztról érkezett válaszokhoz különböző értékű RTT-k tartoznak. Mi lehet az oka?",type:"multi",opts:["Időközben változhatott az útvonal","Időközben változhatott a forgalmi terhelés az útvonal mentén","Időközben változhatott a router terhelése.","Az egy adott forrásból érkező pingeket a router egyre kisebb prioritással dolgozza fel és válaszolja meg"],correct:[0,1,2],
 explain:"Változó RTT okai: útvonal változhat, terhelés változhat az úton, router-ek terhelése változik. A prioritás csökkentés nem általános viselkedés."},
{t:"Milyen alapvető szerkezeti részekre osztható fel az internet?",type:"single",opts:["Belső hálózat és külső hálózat","Otthoni hálózat és külső hálózat","A hálózat üzenetei és hozzáférési protokolljai","A hálózat pereme (edge), hozzáférési része (access) és magja (core)","Privát hálózat és publikus hálózat"],correct:[3],
 explain:"Az internet 3 részre osztható: perem (végfelhasználók), hozzáférési hálózat (DSL, WiFi) és mag (gerinchálózat, routerek)."},
{t:"Milyen multiplexálást alkalmazunk a csomagkapcsolás esetén?",type:"text",correct:"statisztikai",
 explain:"Csomagkapcsolásnál statisztikai multiplexálást alkalmaznak – a sávszélességet dinamikusan osztják szét igény szerint."},
{t:"Melyik réteg felel az adatoknak a (logikailag) szomszédos hálózatelemek közötti továbbításért?",type:"text",correct:"adatkapcsolati",
 explain:"Az adatkapcsolati réteg (Data Link Layer) felel a szomszédos hálózati elemek közötti (hop-by-hop) adattovábbításért."},
{t:"Mi NEM igaz a socketekre?",type:"single",opts:["A szállítási réteg szolgáltatását veszi igénybe","Egy hálózati alkalmazás processze ezen keresztül kommunikál a másik oldallal","Egy hoszton egyszerre csak egy socket lehet nyitva"],correct:[2],
 explain:"Egy hoszton egyszerre TÖBB socket is lehet nyitva – minden kapcsolathoz/alkalmazáshoz külön socket."},
{t:"Milyen metódusok vannak HTTP/1.0-ban?",type:"multi",opts:["POST","GET","PUT","HEAD","PULL"],correct:[0,1,3],
 explain:"HTTP/1.0 metódusok: GET, POST, HEAD. PUT a HTTP/1.1-ben lett szabványos. PULL nem HTTP metódus."},
{t:"Egy sikeres ping segítségével melyik kettőt tudjuk megállapítani?",type:"multi",opts:["... hány ugráson keresztül érjük el a távoli hosztot","... sikeresen kapcsolódott-e a processzünk a szerverhez","... be van kapcsolva a távoli hoszt","... mekkora az aktuális RTT a távoli hoszttal való kommunikációban","... milyen porton kommunikálunk a távoli hoszttal"],correct:[2,3],
 explain:"Ping: megtudjuk hogy be van-e kapcsolva a hoszt és az RTT értékét. Ugrásszámot traceroute mutatja, portot/processzkapcsolatot ping nem."},
{t:"Milyen előnyei vannak a csomagkapcsolásnak az áramkörkapcsolással szemben?",type:"single",opts:["Nem fordulhat elő adatvesztés","Kisebb az adatátviteli késleltetése","Kevesebb fejlécadat átvitelét igényli (kisebb az overhead)","Kevésbé terheli a kapcsolóeszközöket","Jobban kihasználja a link-erőforrásokat ingadozó intenzitású forgalom esetén"],correct:[4],
 explain:"Csomagkapcsolás fő előnye: statisztikai multiplexálás → jobb kihasználtság ingadozó forgalomnál."},
{t:"Mi NEM igaz az SMTP protokollra?",type:"multi",opts:["Titkosított bináris vezérlőinformációkat használ","Levelek törlésére alkalmazható","A 25-ös TCP portot használja a szerver-oldal","A 25-ös TCP portot használja a kliens-oldal","Peer-to-peer architektúrájú"],correct:[0,1,3,4],
 explain:"SMTP: szöveges parancsok (nem titkosított bináris), push protokoll (nem töröl), szerver a 25-ös portot figyeli (kliens tetszőleges portot használ), kliens-szerver architektúra."},
{t:"Egy hálózati alkalmazás egy processze milyen objektumon keresztül adja át üzeneteit a szállítási rétegnek?",type:"text",correct:"socket",
 explain:"Socket – az alkalmazás és a szállítási réteg közötti interfész."},
{t:"Mi a különbség a TCP és az UDP alapú socketek között?",type:"multi",opts:["Az UDP socketnél nincs szükség kapcsolódásra, csak küldésre","Az UDP sockethez nem kötődik hozzá a küldő oldali port","A TCP socket kétirányú, stream jellegű felületet biztosít a processznek","A TCP socketnél az adatküldéskor paraméterben meg kell adni a cél hoszt IP címét"],correct:[0,2],
 explain:"UDP: kapcsolatmentes (csak küldés), de kötődik hozzá port. TCP: kétirányú stream, kapcsolat alapú (a cél előre meghatározott)."},
{t:"Mi igaz az FTP protokollra?",type:"multi",opts:["Az adatátvitelhez külön kapcsolatot épít fel","Peer-to-peer architektúrájú","Megbízható adatátvitelt igényel","Állapotmentes","Szöveges parancsokat használ"],correct:[0,2,4],
 explain:"FTP: külön adat- és vezérlőkapcsolat, TCP alapú (megbízható), szöveges parancsok, kliens-szerver (nem P2P), állapottal rendelkezik."},
{t:"Az alábbiak közül melyik TCP flag (jelző bit)?",type:"single",opts:["SYN (sorszám szinkronizálás)","INT (kapcsolat kezdete)","WIN (vételi ablak beállítás)","ERR (hibás üzenet)"],correct:[0],
 explain:"TCP flagek: SYN, ACK, FIN, RST, PSH, URG. INT, WIN, ERR nem TCP flagek."},
{t:"Mi igaz a TCP kapcsolatkezelésére?",type:"multi",opts:["A kapcsolat lebontása egy ACK üzenettel végződik","A kliens a kapcsolatot a FIN üzenet elküldésével lezártnak tekinti","A kapcsolat felépítését a szerver kezdeményezi","A kapcsolat csak akkor bontható, ha a vételi ablak értéke nullára csökkent","A kapcsolat lebontása során a SYN flag mindig nulla"],correct:[0,4],
 explain:"TCP lebontás: 4 üzenet (FIN, ACK, FIN, ACK), az utolsó ACK-kal zárul. SYN flag a lebontásban valóban nulla. A kliens küldhet adatot FIN után is (half-close)."},
{t:"Mi igaz a TCP torlódáskezelésre?",type:"single",opts:["Független a körülfordulási időtől (round-trip time RTT)","Nem rendelkezik információval a torlódás helyéről","Felhasználja a vételi ablakot is","Támaszkodik a köztes csomópontok által küldött visszajelzésekre is"],correct:[1],
 explain:"TCP torlódáskezelés: csomagvesztés alapú, nem tudja hol a torlódás. A vételi ablak forgalomszabályozás, nem torlódáskezelés (bár mindkettő befolyásolja a küldési ablakot)."},
{t:"Az alábbiak közül melyik feladatra NEM képes a Wireshark?",type:"single",opts:["Telnet kapcsolat létesítésekor a küldött jelszó megjelenítésére","DNS kérésben az álnévhez tartozó kanonikus név megjelenítésére","HTTP GET kérés esetén a kéréshez tartozó paraméterek megjelenítésére","SSH kapcsolat létesítésekor a küldött felhasználói név megjelenítésére"],correct:[3],
 explain:"SSH titkosított → Wireshark nem tudja olvasni a tartalmát (felhasználónevet sem). Telnet, DNS, HTTP szöveges → látható."},
{t:"Milyen módszer alapján becsli a TCP az RTT-t?",type:"single",opts:["A korábbi mintákhoz súlyozott átlagához egy biztonsági tényezőt hozzáadva","A legutolsó RTT minta alapján","A korábbi RTT minták súlyozott átlaga alapján","A legutolsó minta és egy biztonsági tényező szorzata alapján"],correct:[0],
 explain:"TCP RTT becslés: EWMA (exponentially weighted moving average) + biztonsági tényező (DevRTT). EstimatedRTT + 4*DevRTT = TimeoutInterval."},
{t:"Mi igaz UDP üzenetek demultiplexálására?",type:"single",opts:["Minden szegmenst a forrás IP, cél IP pár alapján megkülönböztetve küld a megfelelő sockethez","Minden szegmenst a forrás portszám, cél portszám pár alapján megkülönböztetve küld a megfelelő sockethez","Minden szegmenst a cél IP, cél portszám pár alapján megkülönböztetve küld a megfelelő sockethez","Minden szegmenst a forrás IP, forrás portszám, cél IP, cél portszám négyes alapján megkülönböztetve küld a megfelelő sockethez","Minden szegmenst a forrás IP, forrás portszám pár alapján megkülönböztetve küld a megfelelő sockethez"],correct:[2],
 explain:"UDP demux: cél IP + cél port alapján – ha ugyanaz a cél, ugyanahhoz a sockethez megy, függetlenül a forrástól."},
{t:"Az alábbiak közül melyik igaz a TCP alapú socketekre?",type:"multi",opts:["A szerver külön socketet tart fenn minden kapcsolathoz. A szerver socket folyamatosan nyitva van a kliensek fogadására","A szerver socket portszáma az adott alkalmazásnak megfelelő, szabványnak megfelelő 'jól ismert' port szám","A kapcsolat létesítését a szerver socketnek kell kezdeményeznie","Datagramok átküldésére szolgál"],correct:[0,1],
 explain:"A két igaz állítás: (1) Minden klienshez külön kapcsolat-socket jön létre, a listening socket folyamatosan nyitva van. (2) A SZERVER socket portszáma a jól ismert port (pl. 80 HTTP, 443 HTTPS, 22 SSH) – a kliens ephemeral (véletlenszerű) portot használ, nem a szerver! A 'kapcsolatot a szerver kezdeményezi' HAMIS – mindig a kliens kezdi (SYN). A 'datagram' az UDP sajátja, TCP streames."},
{t:"Mi igaz az UDP protokollra?",type:"multi",opts:["Az UDP a küldött adatok megérkezésére nem ad garanciát","Az alkalmazási rétegtől kapott üzenetet nem szegmentálja tovább","Nem képes forgalomszabályozásra","Beépített megoldást tartalmaz a szegmens hibáinak detektálására"],correct:[0,2,3],
 explain:"UDP: nincs megbízhatóság, nincs forgalomszabályozás, de van checksum (hibadetektálás). Szegmentálást nem végez (az alkalmazásra bízza)."},
{t:"Mi igaz a TCP nyugtázására?",type:"single",opts:["Amennyiben minden korábban küldött szegmens nyugtázásra került, a következő szegmens SEQ értéke megegyezik az utolsó nyugta ACK értékével","Csakis akkor küldhető a következő szegmens, ha az előzőre megjött már a nyugta","A nyugta az utolsó vett bájt sorszámát tartalmazza","Mindig a legutolsó vett csomag nyugtázására szolgál"],correct:[0],
 explain:"TCP: kumulatív nyugtázás. Ha minden korábbi bájt megérkezett, a következő SEQ = előző ACK. Az ACK a következő várt bájt sorszámát tartalmazza (nem az utolsó vettet)."},
{t:"Az alábbiak közül melyik feladatra NEM képes a Wireshark?",type:"single",opts:["SSH kapcsolat létesítésekor a küldő portszámának meghatározására","Ping üzenet küldésekor a köztes csomópontok IP címének megjelenítésére","Telnet kapcsolat létesítése után a küldött adatok megjelenítésére","TCP üzenet vezérlési információinak megjelenítésére"],correct:[1],
 explain:"Ping (ICMP) nem tartalmaz köztes csomópontok IP-jét – azt traceroute mutatja. Wireshark csak a fogott csomagokat látja, nem a routing-t."},
{t:"Mit jelent a gyors újraküldés (Fast Retransmit)?",type:"single",opts:["A TCP-nél a harmadik duplikált nyugta után újraküldjük a szegmenst","A TCP-nél adott időközönként felezzük a becsült RTT értéket","Az UDP ezzel a mechanizmussal pótolja az elveszett szegmenseket"],correct:[0],
 explain:"Fast Retransmit: 3 duplikált ACK érkezése esetén a timeout lejárta előtt újraküldi az elveszett szegmenst."},
{t:"Mi igaz a TCP üzenetek demultiplexálására?",type:"single",opts:["Az egy processznek jövő üzeneteket már nem bontja külön","Mivel a TCP kapcsolatmentes protokoll, ezért csak a cél IP címre és portszámra van szükség hozzá","Mivel a TCP kapcsolatalapú protokoll, ezért csak a forrás és cél IP-re van szükség hozzá","Pontosan ugyanazokat az azonosítókat használja fel mint az UDP demultiplexálás","Ha két üzenetnek különböző a forrás portszáma, akkor más sockethez küldi őket tovább"],correct:[4],
 explain:"TCP demux: 4-tuple (forrás IP+port, cél IP+port). Ha különböző forrásport → más socket. Ez különbözik az UDP-től."},
{t:"Melyik állítás igaz a CIDR-ben használt hálózati maszkokra?",type:"multi",opts:["A címtől független értéket vehet fel","Egyes bitek sorozatát nullás bitek sorozata követi","Az IPv4-ben nem használhatók","Egy cím beállításakor nem kötelező megadni az ilyen maszkot"],correct:[0,1],
 explain:"CIDR maszk: tetszőleges prefix hosszú (nem osztályhoz kötött), 1-esek sorozatát 0-k követik. IPv4-ben is használható, megadása kötelező."},
{t:"Melyik állítás igaz a hálózati rétegekre?",type:"multi",opts:["Megbízható átvitelt biztosít két hálózati végpont között","Fő feladata, hogy datagramokat továbbítson a célcímben szereplő hoszt, vagy a router-interfész felé","Az útvonalválasztás adatait továbbítja a transzport réteg felé","A transzport réteg szegmenseit ennek segítségével tudjuk eljuttatni a megfelelő hoszthoz"],correct:[1,3],
 explain:"Hálózati réteg: datagram továbbítás cél felé, szegmensek célba juttatása. Megbízhatóság a TCP feladata, nem a hálózati rétegé."},
{t:"Mi igaz a RIP protokollra?",type:"multi",opts:["Linkállapot alapú","Távolságvektor alapú","Az osztályalapú összevonást nem támogatja","Intra-AS","Hierarchikus"],correct:[1,3],
 explain:"RIP: távolságvektor alapú, IGP (intra-AS). OSPF a link-state IGP."},
{t:"Mi az első, interfésznek adható cím a 102.166.140.0/23 hálózatban? Csak a címet írja be!",type:"text",correct:"102.166.140.1",
 explain:"/23 → hálózati cím: 102.166.140.0, első hoszt: 102.166.140.1"},
{t:"Melyik állítás igaz a hálózati rétegekre?",type:"multi",opts:["A TCP/IP protokoll-verem (protocol stack) tartalmaz ilyen réteget","Egyik fő funkciója az útvonalválasztás","Ezt a réteget nem kell megvalósítani az útvonalválasztókban","A ISO-OSI rétegmodell nem tartalmaz ilyen réteget","Egyik fő funkciója az Internetre kapcsolt hálózati elemek egyedi megcímzése"],correct:[0,1,4],
 explain:"Hálózati réteg: megvan TCP/IP-ben, útvonalválasztás, egyedi megcímzés. Az OSI IS tartalmazza (L3), és routerekben IS megvalósítandó."},
{t:"Melyik állítás igaz az Interneten használt címzésre?",type:"multi",opts:["A szomszédos címek átfedik egymást","A hálózatrészek önállóan működőképesek","Négyszintű hierarchiát alkot","Az IP címek alapváltozata 4 byte-ot tartalmaz"],correct:[1,3],
 explain:"IP cím: 4 byte (32 bit), IPv4. A hálózatok önállóan működőképesek. Nem négyszintű (CIDR változó hosszú), szomszédos alhálózatok nem fedik át egymást."},
{t:"Hogy nevezzük az automatikus címkonfigurációt megvalósító protokollt?",type:"text",correct:"DHCP",
 explain:"DHCP = Dynamic Host Configuration Protocol – automatikusan oszt ki IP-t és egyéb hálózati beállításokat."},
{t:"Melyik állítás igaz az útvonalak statikus konfigurációjára?",type:"multi",opts:["Úgy is megadható vele egy távoli hálózathoz tartozó irány, hogy nem közvetlenül a kimenőinterfészt adjuk meg","Az így konfigurált bejegyzéseken már nem lehet később változtatni","Speciális esetenként 0 hosszú maszkkal statikusan megadható az alapértelmezett út","A beállításokhoz elengedő a router-hez közvetlenül kapcsolódó hálózatokat ismerni, nincs szükség a teljes hálózati képre","Nagy hálózatokban konfigurációs szempontból nem hatékony a használata"],correct:[0,2,4],
 explain:"Statikus út: next-hop IP-vel is megadható (nem csak interfész), 0.0.0.0/0 = default route, változtatható, csak lokális info kell, de nagy hálózatnál nem skálázódik."},
{t:"Mi a különbség az IGP és az EGP protokollok között?",type:"single",opts:["A két protokollcsalád között csak elnevezésbeli különbség van","Az IGP távolságvektort, az EGP linkállapotokat használ","Az EGP-t elsősorban oktatási intézmények használják, az IGP-t pedig inkább nagyvállalatok","Az IGP-t egy autonóm rendszeren (AS) belül használjuk, az EGP-t AS-ek között"],correct:[3],
 explain:"IGP (pl. OSPF, RIP) = AS-en belül. EGP (BGP) = AS-ek között. Mindkettő lehet link-state vagy távolságvektor."},
{t:"Mi a broadcast cím a 103.102.136.0 hálózatban, ha a netmask 255.255.252.0? Csak a címet írja be!",type:"text",correct:"103.102.139.255",
 explain:"255.255.252.0 = /22. 103.102.136.0–103.102.139.255. Broadcast: 103.102.139.255"},
{t:"Melyek a hálózati réteg fő feladatai?",type:"multi",opts:["Továbbítás","Gateway keresés","Párosítás","Címzés","Útvonal-választás","Kapcsolatfelépítés"],correct:[0,3,4],
 explain:"Hálózati réteg fő feladatai: továbbítás (forwarding), útvonalválasztás (routing), és megcímzés (addressing)."},
{t:"Mikor kell az alapértelmezett átjáró felé küldeni egy datagramot?",type:"single",opts:["Ha a célcímet lemaszkolva a küldő hoszt maszkjával, az alapértelmezett átjáró hálózati címét kapjuk","Ha a célcím másik hálózatba esik","Mindig. Ha a hálózaton belül marad a forgalom, az alapértelmezett átjáró visszaküldi azt","Ha a célhálózat maszkja eltérő a küldő hosztnál megadott maszktól"],correct:[1],
 explain:"Default gateway felé küldés: ha a cél más hálózatban van (a helyi maszkolás alapján nem egyezik a hálózati cím)."},
{t:"Az alábbiak közül melyik NEM IPv6 fejléc mező?",type:"single",opts:["Verziószám","Célcím","Fejléc hossz","Hátralévő hopok megengedett száma"],correct:[2],
 explain:"IPv6 fejléc: fix 40 byte, nincs 'fejléc hossz' mező (az IPv4-ben van). Tartalmaz: verzió, forgalom osztály, folyam azonosító, payload hossz, következő fejléc, hop limit, forrás+cél cím."},
{t:"Mi igaz a dinamikus routinggal kapcsolatban?",type:"multi",opts:["Egyik ismert ilyen protokoll az OSPF","A datagramok útvonala dinamikusan változik, vagyis a router nem a routing táblákat veszi figyelembe a továbbításkor","Minden dinamikus megoldásnak van olyan összetevője, ami automatikusan felderíti a teljes hálózati topológiát","A hálózat változása esetén az irányítási táblák automatikusan (kézi beavatkozás nélkül) frissülnek"],correct:[0,3],
 explain:"Dinamikus routing: OSPF ismert példa, táblák automatikusan frissülnek. Nem minden protokoll deríti fel a teljes topológiát (pl. BGP policy alapú)."},
{t:"Az alábbiak közül mely mezők szerepelnek egy IPv4 datagram fejlécében?",type:"multi",opts:["célcím maszkja","hossz","fregmens-azonosító","forráscím","nyugta sorszáma"],correct:[1,2,3],
 explain:"IPv4 fejléc: hossz (total length), töredék azonosító, forráscím, célcím. Maszk nem fejléc mező, nyugta sorszám TCP fejlécben van."},
{t:"Az alábbiak közül melyik NEM a fizikai réteg feladata?",type:"single",opts:["Dekódolás","Keret visszaállítása a bitekből","Vonali kódolás","Keretezés"],correct:[3],
 explain:"Keretezés az adatkapcsolati réteg feladata. Fizikai réteg: kódolás/dekódolás, bitátvitel."},
{t:"Melyik két állítás igaz a VLAN-ok trunk porton, router-on-a-stick megvalósítással való összekapcsolásra?",type:"multi",opts:["Jóval költségesebb megoldás, mint ha minden egyes VLAN a router egy-egy dedikált portján keresztül kommunikálna","Egyetlen router port elegendő a kialakításhoz","A különböző forgalmakat nem kell tag-ekkel ellátni, mivel minden VLAN egyedi interfészen keresztül kommunikál a routerrel","Minden egyes VLAN-hoz külön al-interfészt kell beállítani a routeren"],correct:[1,3],
 explain:"Router-on-a-stick: egyetlen fizikai port elegendő (trunk), minden VLAN-hoz al-interfész (sub-interface) kell, tag-ekkel különböztetik meg a forgalmakat."},
{t:"Milyen működési módokat definiáltak WiFi esetén?",type:"multi",opts:["Broadcast mód","Multicast mód","Infrastruktúra mód","Ad-hoc mód"],correct:[2,3],
 explain:"WiFi módok: infrastruktúra mód (AP-n keresztül) és ad-hoc mód (közvetlen eszköz-eszköz kapcsolat)."},
{t:"Melyik két közegtípus fordul elő általában a hálózatokban?",type:"multi",opts:["Üzenetszórásos (broadcast) link","Pont-pont link","Multicast link","Virtuális link"],correct:[0,1],
 explain:"Hálózati közegtípusok: pont-pont (pl. PPP, leased line) és üzenetszórásos (pl. Ethernet, WiFi)."},
{t:"Amikor egy hoszt egy másik LAN-ba először szeretne csomagot küldeni, akkor kinek a fizikai címét kell ARP-vel felderítenie?",type:"single",opts:["A default gateway-ét","A célhosztét","A legközelebbi switchét","Senkiét"],correct:[0],
 explain:"Más LAN-ba küldéskor: a datagramot a default gateway-nek kell küldeni → annak MAC-jét kell ARP-vel felderíteni."},
{t:"Az alábbiak közül melyik állítás igaz a LAN-okra?",type:"single",opts:["A LAN-on belül ütközés nélkül egyszerre csak egy hoszt küldhet adatot","Egy LAN-ban legfeljebb egy switch lehet","A LAN-on belüli kommunikációhoz nincs szükség ARP üzenetekre","A bennük lévő switch-ek a hosztok számára transzparensek"],correct:[3],
 explain:"Switch-ek transzparensek: a hosztok nem tudnak róluk, az IP/MAC szintű kommunikáció szempontjából nem látszanak."},
{t:"Melyik állítás igaz a CSMA/CA-ra?",type:"single",opts:["Ez a módszer az ütközések detektálását teszi lehetővé","Foglalt csatorna esetén véletlenszerűen választott várakozási idővel operál","Használata esetén nem alakulhat ki a rejtett terminál probléma","Az Ethernet is ezt a módszer használja"],correct:[1],
 explain:"CSMA/CA: ütközés ELKERÜLÉS (nem detektálás), véletlenszerű backoff idővel vár. Rejtett terminál probléma CSMA/CA-nál is előfordulhat (RTS/CTS kell ellene)."},
{t:"Melyik két állítás igaz a switch-ek access portjaira?",type:"multi",opts:["Egyszerre csak egy VLAN-hoz tartoznak","VLAN-ok alkalmazása esetén a switch-ek között tipikusan ilyen típusú portot kell konfigurálni","Az ilyen típusú porton áthaladó különböző VLAN-ba tartozó forgalmakat tag-ekkel kell elkülöníteni egymástól","Az ilyen típusú porton áthaladó forgalmakat nem kell tag-ekkel megjelölni"],correct:[0,3],
 explain:"Access port: csak egy VLAN-hoz tartozik, nem használ tag-eket (a végeszköz nem látja a VLAN tag-et). Switch-ek között trunk portot használnak."},
{t:"Mi igaz a CSMA-CD-re?",type:"single",opts:["Vezetékes esetben nem működik ez a megoldás","Ütközés esetén a csomagok nem kerülnek később újraküldésre","Ütközés elkerülést valósít meg","Ütközés érzékelése esetén egy speciális jelet (jam signal) sugároz"],correct:[3],
 explain:"CSMA-CD: ütközés ÉRZÉKELÉS (nem elkerülés). Ütközéskor jam signal-t küld, majd random backoff. Vezetékesen működik (Ethernet)."},
{t:"Melyik állítások NEM igazak a csatornaosztásos protokollokra?",type:"multi",opts:["Egyik esete az SDMA","Ingadozó, egyenetlen terhelés esetén kihasználatlan egységek maradnak","Egy adott közeghez csatlakozó végpontok mindegyikéhez egy adási egységet rendel","Állandó forgalmi terhelés esetén nem hatékony, ezért nem érdemes használni","Egy lehetséges megoldás a réselt ALOHA"],correct:[3,4],
 explain:"Három NEM igaz állítás: (1) SDMA térbeli szétválasztás, nem csatornaosztás. (2) 'Állandó forgalomnál nem hatékony' – HAMIS, éppen állandó terhelésnél a legjobb. (3) A réselt ALOHA véletlen hozzáférési protokoll, nem csatornaosztásos – tehát ez sem igaz rá."},
{t:"Melyik állítás igaz a rejtett terminál problémával kapcsolatban?",type:"multi",opts:["A Wifi-nél csatorna lefoglalási mechanizmussal oldják meg","A jelelnyomási hatás okozza","Ütközés lép fel a fogadónál, mert a másik küldő jelét nem érzékeljük","Ez egy rejtett probléma, ami nem minden esetben derül ki"],correct:[0,2],
 explain:"Rejtett terminál: RTS/CTS csatornalfoglalással oldják meg WiFi-ben. Ütközés a fogadónál, mert az egyik adó nem hallja a másikat."},
{t:"Melyik állítás igaz a VLAN-ok trunk porton, router-on-a-stick megvalósítással való összekapcsolásra?",type:"multi",opts:["Segítségével egy VLAN-hoz több külön IP hálózat rendelhető","Olcsóbb kiépíteni, mint több linkkel összekötni a routert és a switchet","Nem kell a routerben minden VLAN-hoz külön fizikai interfészt rendelni","Csak akkor van rá szükség, ha switch nélkül valósítjuk meg a VLAN-t"],correct:[1,2],
 explain:"Router-on-a-stick: olcsóbb (egy port elég), nem kell külön fizikai interfész VLAN-onként."},
{t:"Melyik állítás igaz a véletlen hozzáférési protokollokra?",type:"multi",opts:["A felosztott csatorna egységeit véletlenszerűen osztja ki a végpontoknak","Az adás idejére a teljes csatornához férnek hozzá a közeghez kapcsolt végpontok","Az alkalmazás kizárja az ütközéseket","Alacsonyabb, ingadozó forgalom esetén célszerűbb használni"],correct:[1,3],
 explain:"Véletlen hozzáférés: adáskor a teljes csatornát használja (nem osztja szét), ingadozó forgalomnál hatékony, de ütközések lehetségesek."},
{t:"Az alábbiak közül melyik NEM a switch funkciója?",type:"single",opts:["Hálózati rétegbeli funkciók (pl. útválasztás) ellátása","Redundáns hálózatok estén feszítőfa képzés","A LAN-ok különálló részekre (ütközési tartományokra) való szegmentálása","A MAC cím - port párok nyilvántartása egy táblázatban"],correct:[0],
 explain:"Az útválasztás (routing) a hálózati réteg (router) feladata, nem a switch-é. Switch L2-es eszköz."},
{t:"Mi igaz az optikai kábelekre?",type:"single",opts:["Az optikai kábelek nem alkalmasak párhuzamosan több felhasználó adatának átvitelére","Ennél az átviteli közegnél tipikus zavaró hatás az áthallás","Az interferencia csökkentés érdekében célszerű az érpárokat összecsavarni","1 GB-es optikai átvitel jelölése például 1000BASE-FX"],correct:[3],
 explain:"1000BASE-FX: 1 Gbps optikai Ethernet. Az optikai kábel nem érzékeny EMI-re/áthallásra, és párhuzamos átvitelre (WDM-mel) is alkalmas."},
{t:"Melyik switch-típus NEM jellemző az adatközpontok szervereinek összekötésénél?",type:"single",opts:["Központi","Top-of-Rack","Virtuális","Aggregáló"],correct:[2],
 explain:"Adatközpontban: Top-of-Rack, aggregáló és gerinc (spine) switchek jellemzők. 'Virtuális' switch nem standard adatközpont switch típus."},
{t:"Melyik állítás igaz a levelezési protokollokra?",type:"single",opts:["A POP3 protokoll felel a levelek titkosításáért.","Az IMAP protokoll nem képes felhasználói állapotok munkamenetek közti megjegyzésére.","A POP3 protokollt szokták levelek küldésére is használni.","Az IMAP protokollt a levelek levelezőszerverről való letöltésére is szokták használni."],correct:[3],

{t:"Mi igaz a TCP protokollra?",type:"single",opts:["Az időtúllépés megállapításához méri az RTT értékét.","Multicast küldési lehetőséget is tartalmaz.","Periodikus kézfogások segítségével éri el a megbízhatóságot.","Nem tartalmaz torlódáskezelést."],correct:[0],
 explain:"TCP méri az RTT-t (Round Trip Time) és ebből számolja a timeout értéket (EstimatedRTT + 4×DevRTT). Nem tartalmaz multicastot (az IP réteg feladata), a megbízhatóságot sorszámozás+nyugtázás biztosítja (nem periodikus kézfogás), és TARTALMAZ torlódáskezelést."},
{t:"Az alábbi alkalmazások közül melyiknek rugalmas a sávszélesség igénye?",type:"multi",opts:["E-mail","Internetes telefonálás","Azonnali üzenetküldés","Videókonferencia","Fájlátvitel"],correct:[0,2,4],
 explain:"Rugalmas (elastic) sávszélesség igény: E-mail, azonnali üzenetküldés, fájlátvitel – ezek várhatnak, nem érzékenyek a késleltetésre. NEM rugalmas: internetes telefonálás és videókonferencia – ezek valós idejű alkalmazások, fix minimális sávszélességet és alacsony késleltetést igényelnek."},
