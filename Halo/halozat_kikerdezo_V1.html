// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let questions = [];
let answers = {}; // qIndex → {selected, correct}
let totalAnswered = 0, totalCorrect = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS).map((q, i) => ({...q, _idx: i}));
  answers = {};
  totalAnswered = 0;
  totalCorrect = 0;
  document.getElementById('results').style.display = 'none';
  renderQuiz();
  updateProgress();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function showAll() {
  questions = shuffle(ALL_QUESTIONS).map((q, i) => ({...q, _idx: i}));
  answers = {};
  totalAnswered = 0;
  totalCorrect = 0;
  document.getElementById('results').style.display = 'none';
  renderQuiz();
  updateProgress();
}

function resetQuiz() {
  questions = [];
  answers = {};
  totalAnswered = 0;
  totalCorrect = 0;
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('results').style.display = 'none';
  updateProgress();
  document.getElementById('score-live').textContent = '';
}

function updateProgress() {
  const total = questions.length;
  const done = Object.keys(answers).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('prog-text').textContent = `${done} / ${total} megválaszolva`;
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  if (total > 0) {
    document.getElementById('score-live').textContent = `✓ ${totalCorrect}  ✗ ${totalAnswered - totalCorrect}`;
  }
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, qi) => {
    container.appendChild(buildCard(q, qi));
  });
}

function buildCard(q, qi) {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `card-${qi}`;

  const num = document.createElement('div');
  num.className = 'q-number';
  num.textContent = `KÉRDÉS ${qi + 1} / ${questions.length}`;
  card.appendChild(num);

  const txt = document.createElement('div');
  txt.className = 'q-text';
  txt.textContent = q.t;
  card.appendChild(txt);

  if (q.type === 'text') {
    // Text input
    const wrap = document.createElement('div');
    wrap.className = 'text-input-wrap';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'text-input';
    inp.placeholder = 'Írja be a választ...';
    inp.id = `inp-${qi}`;
    wrap.appendChild(inp);
    card.appendChild(wrap);

    const btn = document.createElement('button');
    btn.className = 'q-submit';
    btn.textContent = 'Ellenőrzés';
    btn.onclick = () => checkText(qi, q, inp, btn, card, fb);
    card.appendChild(btn);
  } else {
    // Options
    const opts = document.createElement('div');
    opts.className = 'options';
    opts.id = `opts-${qi}`;

    const isMulti = q.type === 'multi';
    const selectedSet = new Set();

    let shuffledOpts = q.opts.map((text, origIdx) => ({ text, origIdx }));
    shuffledOpts = shuffle(shuffledOpts);

    shuffledOpts.forEach((optItem) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.dataset.origIdx = optItem.origIdx;

      const marker = document.createElement('div');
      marker.className = isMulti ? 'multi-marker' : 'opt-marker';
      if (isMulti) marker.textContent = '✓';

      const lbl = document.createElement('span');
      lbl.textContent = optItem.text;

      div.appendChild(marker);
      div.appendChild(lbl);

      div.onclick = () => {
        if (div.classList.contains('disabled')) return;
        if (isMulti) {
          if (selectedSet.has(optItem.origIdx)) {
            selectedSet.delete(optItem.origIdx);
            div.classList.remove('selected');
          } else {
            selectedSet.add(optItem.origIdx);
            div.classList.add('selected');
          }
        } else {
          // single
          opts.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          div.classList.add('selected');
          selectedSet.clear();
          selectedSet.add(optItem.origIdx);
        }
      };

      opts.appendChild(div);
    });

    card.appendChild(opts);

    const btn = document.createElement('button');
    btn.className = 'q-submit';
    btn.textContent = 'Ellenőrzés';
    btn.onclick = () => checkChoice(qi, q, selectedSet, opts, btn, card, fb);
    card.appendChild(btn);
  }

  // Feedback
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = `fb-${qi}`;
  card.appendChild(fb);

  return card;
}

function checkChoice(qi, q, selectedSet, opts, btn, card, fb) {
  if (selectedSet.size === 0) return;
  btn.style.display = 'none';

  const correctSet = new Set(q.correct);
  const isCorrect = selectedSet.size === correctSet.size &&
    [...selectedSet].every(i => correctSet.has(i));

  // Disable all
  opts.querySelectorAll('.option').forEach((div) => {
    div.classList.add('disabled');
    div.classList.remove('selected');
    
    const origIdx = parseInt(div.dataset.origIdx, 10);

    if (correctSet.has(origIdx) && selectedSet.has(origIdx)) div.classList.add('correct');
    else if (!correctSet.has(origIdx) && selectedSet.has(origIdx)) div.classList.add('wrong');
    else if (correctSet.has(origIdx) && !selectedSet.has(origIdx)) div.classList.add('missed');
    
    const m = div.querySelector('.opt-marker, .multi-marker');
    if (correctSet.has(origIdx)) m.textContent = '✓';
    else if (selectedSet.has(origIdx)) m.textContent = '✗';
  });

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  fb.className = `feedback show ${isCorrect ? 'ok' : 'fail'}`;
  fb.innerHTML = (isCorrect ? '✓ Helyes!' : '✗ Hibás!') +
    (q.explain ? `<br><br>${q.explain}` : '');

  recordAnswer(qi, isCorrect);
}

function checkText(qi, q, inp, btn, card, fb) {
  const val = inp.value.trim().toLowerCase();
  if (!val) return;
  btn.style.display = 'none';
  inp.disabled = true;

  const correct = Array.isArray(q.correct)
    ? q.correct[0].toLowerCase()
    : q.correct.toLowerCase();

  const isCorrect = val === correct ||
    val.replace(/[áéíóöőúüű]/g, c => ({á:'a',é:'e',í:'i',ó:'o',ö:'o',ő:'o',ú:'u',ü:'u',ű:'u'}[c]||c)) ===
    correct.replace(/[áéíóöőúüű]/g, c => ({á:'a',é:'e',í:'i',ó:'o',ö:'o',ő:'o',ú:'u',ü:'u',ű:'u'}[c]||c));

  inp.className = `text-input ${isCorrect ? 'correct-input' : 'wrong-input'}`;
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  fb.className = `feedback show ${isCorrect ? 'ok' : 'fail'}`;
  fb.innerHTML = (isCorrect ? '✓ Helyes!' : `✗ Hibás! Helyes válasz: <strong>${q.correct}</strong>`) +
    (q.explain ? `<br><br>${q.explain}` : '');

  recordAnswer(qi, isCorrect);
}

function recordAnswer(qi, isCorrect) {
  if (answers[qi] !== undefined) return;
  answers[qi] = isCorrect;
  totalAnswered++;
  if (isCorrect) totalCorrect++;
  updateProgress();

  if (totalAnswered === questions.length) {
    setTimeout(showResults, 600);
  }
}

function showResults() {
  const pct = Math.round(totalCorrect / questions.length * 100);
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = totalCorrect;
  document.getElementById('res-wrong').textContent = totalAnswered - totalCorrect;
  document.getElementById('res-total').textContent = questions.length;
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.scrollIntoView({behavior: 'smooth'});
}

// Start quiz automatically on page load
startQuiz();
</script>
</body>
</html>
